# Jade Crane — celadon mist, carved jade, gold leaf
mode = "light"

accent = "#2f7a56"
muted = "#556b60"

# selection is the soft tint (btop rows, sidebars); selection_background is
# the active-item fill (gum Yes/No buttons, menus, terminal selection).
selection = "#c5d6c9"
selection_background = "#74b08e"
selection_foreground = "#142820"

background = "#f0efe6"
dark_background = "#e3e2d6"
darker_background = "#d2d1c4"
lighter_background = "#e8ebe3"

foreground = "#1e3a2f"
dark_foreground = "#556b60"
light_foreground = "#2d4a3c"
bright_foreground = "#142820"

# Normal ANSI colors are all >= 4.5:1 on background (WCAG AA text).
red = "#c43a30"
yellow = "#806200"
orange = "#a35214"
green = "#34784a"
cyan = "#25756f"
blue = "#3f6d8c"
magenta = "#8a4f72"
brown = "#7a4e30"

# Bright variants are >= 3.5:1 (WCAG AA for bold/large text).
bright_red = "#d24c40"
bright_yellow = "#937214"
bright_green = "#3f8c58"
bright_cyan = "#2f8882"
bright_blue = "#4f7f9e"
bright_magenta = "#9c6084"
