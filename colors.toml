# Jade Crane — celadon mist, carved jade, gold leaf
mode = "light"

accent = "#2f7a56"
# muted is both faint text (placeholders, line numbers) and a button fill
# under foreground text, so it sits midway: 3.0:1 each way.
muted = "#7a8e83"

# selection is the soft tint (btop rows, sidebars); selection_background is
# the active-item fill (gum Yes/No buttons, menus, terminal selection).
selection = "#c5d6c9"
selection_background = "#74b08e"
selection_foreground = "#142820"

background = "#f0efe6"
dark_background = "#e3e2d6"
darker_background = "#d2d1c4"
lighter_background = "#e8ebe3"

foreground = "#1e3a2f"
dark_foreground = "#556b60"
light_foreground = "#2d4a3c"
bright_foreground = "#142820"

# Every ANSI color, normal and bright, is >= 4.5:1 on background (WCAG AA
# text); editors color code with the brights, so they must be readable too.
red = "#b8372d"
yellow = "#765a00"
orange = "#944a12"
green = "#2d6941"
cyan = "#216863"
blue = "#39627e"
magenta = "#844c6d"
brown = "#7a4e30"

bright_red = "#ba4339"
bright_yellow = "#856712"
bright_green = "#36784c"
bright_cyan = "#297671"
bright_blue = "#46708b"
bright_magenta = "#91597b"
